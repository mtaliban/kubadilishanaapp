name: Build & Release APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'          # v1.0.0, v1.2.3 — inaunda GitHub Release
  pull_request:
    branches: [main, master]  # PR: build tu, hakuna release

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (lint check)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true   # usikatize build kwa lint warnings

      - name: Run unit tests
        run: flutter test --no-pub

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/kubadilishana-release.jks

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Rename APK (weka jina rahisi)
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | tr -d "'")
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/kubadilishana-v${VERSION}.apk
          echo "APK_PATH=build/app/outputs/flutter-apk/kubadilishana-v${VERSION}.apk" >> $GITHUB_ENV
          echo "APK_NAME=kubadilishana-v${VERSION}.apk" >> $GITHUB_ENV

      # ── Upload kama artifact (kwa kila push/PR) ──────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubadilishana-apk
          path: ${{ env.APK_PATH }}
          retention-days: 14

      # ── GitHub Release (kwa tag v* pekee) ───────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Kubadilishana ${{ github.ref_name }}
          body: |
            ## Kubadilishana Vituo — ${{ github.ref_name }}

            ### Pakua APK
            Bonyeza **kubadilishana-*.apk** hapa chini kupakua.

            ### Jinsi ya kuinstall
            1. Pakua APK kwenye simu yako
            2. Nenda Settings → Security → ruhusu "Install from unknown sources"
            3. Bonyeza faili la APK ulilopakua → Install

            > APK hii inaungana na backend: `https://api.16-171-23-21.sslip.io`
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
