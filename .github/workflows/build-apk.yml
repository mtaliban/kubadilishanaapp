name: Build Release APK + AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/kubadilishana-release.jks

      - name: Get dependencies
        run: flutter pub get

      # ── Metadata ─────────────────────────────────────────────────────────
      - name: Get version & date
        id: meta
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          DATE=$(date +'%Y%m%d-%H%M')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      # ══════════════════════════════════════════════════════════════════════
      # ADMIN builds (main.dart — user + admin pages)
      # ══════════════════════════════════════════════════════════════════════

      - name: Build Admin APKs (split-per-abi)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release --split-per-abi -t lib/main.dart

      - name: Rename Admin APKs
        run: |
          V=${{ steps.meta.outputs.version }}
          D=${{ steps.meta.outputs.date }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/kubadilishana-admin-arm64-v${V}-${D}.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             build/app/outputs/flutter-apk/kubadilishana-admin-arm32-v${V}-${D}.apk

      # ══════════════════════════════════════════════════════════════════════
      # USER builds (main_user.dart — user pages tu)
      # ══════════════════════════════════════════════════════════════════════

      - name: Build User APKs (split-per-abi)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release --split-per-abi -t lib/main_user.dart

      - name: Rename User APKs
        run: |
          V=${{ steps.meta.outputs.version }}
          D=${{ steps.meta.outputs.date }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/kubadilishana-user-arm64-v${V}-${D}.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             build/app/outputs/flutter-apk/kubadilishana-user-arm32-v${V}-${D}.apk

      # ── Build User AAB (Play Store) ───────────────────────────────────────
      # AAB = Android App Bundle. Play Store inaigawanya yenyewe kwa kila simu.
      # Mtumiaji wa Play Store anapakua ~15 MB tu (si 20 MB).
      - name: Build User AAB (Play Store)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build appbundle --release -t lib/main_user.dart

      - name: Rename User AAB
        run: |
          V=${{ steps.meta.outputs.version }}
          D=${{ steps.meta.outputs.date }}
          cp build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/kubadilishana-user-playstore-v${V}-${D}.aab

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kubadilishana-builds
          path: |
            build/app/outputs/flutter-apk/kubadilishana-*.apk
            build/app/outputs/bundle/release/kubadilishana-*.aab
          retention-days: 30

      # ── GitHub Release ────────────────────────────────────────────────────
      - name: Delete old latest release (if exists)
        run: |
          gh release delete latest --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Kubadilishana App — Toleo Jipya"
          body: |
            ## 📱 Pakua hapa chini

            ### Kwa Watumiaji — APK ya moja kwa moja
            | Faili | Ukubwa | Simu |
            |-------|--------|------|
            | `kubadilishana-user-arm64-*` | ~20 MB | **Simu za kisasa** (Samsung/Tecno/Itel 2018+) — **chaguo la kwanza** |
            | `kubadilishana-user-arm32-*` | ~18 MB | Simu za zamani (32-bit) — kama arm64 haifanyi kazi |

            ### Kwa Watumiaji — Play Store (AAB)
            | Faili | Maelezo |
            |-------|---------|
            | `kubadilishana-user-playstore-*` | Upload kwenye Google Play Console — Play Store itaweka ~15 MB kwa kila mtumiaji automatically |

            ### Kwa Admins
            | Faili | Simu |
            |-------|------|
            | `kubadilishana-admin-arm64-*` | Simu za kisasa (2018+) |
            | `kubadilishana-admin-arm32-*` | Simu za zamani |

            > **Sijui APK ipi?** Chagua **arm64** kwanza. Kama haitaki, jaribu arm32.
            > **Inakataa install?** Settings → Security → "Install unknown apps" → wezesha

            ---
            🕐 Ilitengenezwa: ${{ steps.meta.outputs.date }}
            📦 Commit: `${{ github.sha }}`
          files: |
            build/app/outputs/flutter-apk/kubadilishana-admin-arm64-*.apk
            build/app/outputs/flutter-apk/kubadilishana-admin-arm32-*.apk
            build/app/outputs/flutter-apk/kubadilishana-user-arm64-*.apk
            build/app/outputs/flutter-apk/kubadilishana-user-arm32-*.apk
            build/app/outputs/bundle/release/kubadilishana-user-playstore-*.aab
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
