name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/kubadilishana-release.jks

      - name: Get dependencies
        run: flutter pub get

      # ── Build 1: Admin APK (user + admin screens) ─────────────────────────
      - name: Build Admin APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release -t lib/main.dart

      - name: Rename Admin APK
        id: admin_apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          DATE=$(date +'%Y%m%d-%H%M')
          ADMIN_NAME="kubadilishana-admin-v${VERSION}-${DATE}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${ADMIN_NAME}
          echo "name=${ADMIN_NAME}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # ── Build 2: User APK (user screens tu — Play Store) ──────────────────
      - name: Build User APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release -t lib/main_user.dart

      - name: Rename User APK
        id: user_apk
        run: |
          VERSION=${{ steps.admin_apk.outputs.version }}
          DATE=${{ steps.admin_apk.outputs.date }}
          USER_NAME="kubadilishana-user-v${VERSION}-${DATE}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${USER_NAME}
          echo "name=${USER_NAME}" >> $GITHUB_OUTPUT

      # ── Upload artifacts ───────────────────────────────────────────────────
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kubadilishana-apks
          path: |
            build/app/outputs/flutter-apk/kubadilishana-admin-*.apk
            build/app/outputs/flutter-apk/kubadilishana-user-*.apk
          retention-days: 30

      # ── GitHub Release ─────────────────────────────────────────────────────
      - name: Delete old latest release (if exists)
        run: |
          gh release delete latest --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Kubadilishana App — Toleo Jipya"
          body: |
            ## 📱 Pakua APK hapa chini

            | APK | Kwa Nani | Maelezo |
            |-----|----------|---------|
            | `kubadilishana-user-*.apk` | **Watumiaji** | Play Store build — user screens tu |
            | `kubadilishana-admin-*.apk` | **Admins** | Admin build — user + admin screens |

            > Kama inakataa sakinishwa: Settings → Security → "Install unknown apps" → wezesha

            ---
            🕐 Ilitengenezwa: ${{ steps.admin_apk.outputs.date }}
            📦 Commit: `${{ github.sha }}`
          files: |
            build/app/outputs/flutter-apk/kubadilishana-admin-*.apk
            build/app/outputs/flutter-apk/kubadilishana-user-*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
