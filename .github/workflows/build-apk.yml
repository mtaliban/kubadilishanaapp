name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/kubadilishana-release.jks

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release

      - name: Prepare APK name
        id: apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          DATE=$(date +'%Y%m%d-%H%M')
          TAG="build-${DATE}"
          APK_NAME="kubadilishana-v${VERSION}-${DATE}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${APK_NAME}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubadilishana-apk
          path: build/app/outputs/flutter-apk/kubadilishana-*.apk
          retention-days: 30

      - name: Delete old latest release (if exists)
        run: |
          gh release delete latest --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Kubadilishana App — Toleo Jipya"
          body: |
            ## 📱 Pakua APK hapa chini

            Bonyeza faili `.apk` hapo chini → pakua → sakinisha kwenye simu.

            > Kama inakataa sakinishwa: Settings → Security → "Install unknown apps" → wezesha

            ---
            🕐 Ilitengenezwa: ${{ steps.apk.outputs.tag }}
            📦 Commit: `${{ github.sha }}`
          files: build/app/outputs/flutter-apk/kubadilishana-*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
