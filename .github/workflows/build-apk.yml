name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK (debug-signed if no keystore)
        run: flutter build apk --release

      - name: Rename APK with version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/kubadilishana-v${VERSION}.apk
          echo "APK_PATH=build/app/outputs/flutter-apk/kubadilishana-v${VERSION}.apk" >> $GITHUB_ENV
          echo "APK_NAME=kubadilishana-v${VERSION}.apk" >> $GITHUB_ENV

      - name: Upload APK as artifact (pakua hapa)
        uses: actions/upload-artifact@v4
        with:
          name: kubadilishana-apk
          path: build/app/outputs/flutter-apk/kubadilishana-*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Kubadilishana App — Build #${{ github.run_number }}"
          body: |
            ## Kubadilishana Vituo APK

            **Jinsi ya kupakua APK:**
            1. Bonyeza jina la faili `.apk` hapo chini
            2. Pakua kwenye simu yako
            3. Sakinisha (kama inakataa, wezesha "Install unknown apps" kwenye Settings)

            ---
            Commit: `${{ github.sha }}`
          files: build/app/outputs/flutter-apk/kubadilishana-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
